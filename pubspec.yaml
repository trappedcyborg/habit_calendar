name: habit_calendar
description: "A new Flutter project."
publish_to: 'none'
version: 1.5.1+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/sf_pro_regular.otf
          weight: 400
        - asset: assets/fonts/sf_pro_bold.otf
          weight: 700